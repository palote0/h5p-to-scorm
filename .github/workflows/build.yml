name: Convert H5P to SCORM (diagnstico)

on:
  push:
    paths:
      - "input.h5p"     # se dispara al tocar input.h5p
  workflow_dispatch:     # añade botón "Run workflow" para relanzar a mano

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Info del runner y Node
        run: |
          set -euxo pipefail
          uname -a
          node -v
          npm -v
          ls -al

      - name: Instalar dependencias
        run: |
          set -euxo pipefail
          npm ci || npm i

      - name: Ejecutar conversión (npm run build)
        run: |
          set -euxo pipefail
          npm run build

      - name: Verificar archivos generados
        if: always()
        run: |
          set -euxo pipefail
          echo "Contenido del workspace tras el build:"
          ls -al
          echo "Buscando output.zip..."
          test -f output.zip && echo "OK: output.zip existe" || (echo "NO existe output.zip" && exit 0)

      - name: Subir artefacto (SCORM ZIP si existe)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output.zip
          if-no-files-found: ignore
          # Si algún día necesitas empaquetar también ficheros ocultos:
          # include-hidden-files: true
