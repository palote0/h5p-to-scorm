name: Convert H5P to SCORM

on:
  push:
    paths:
      - "input.h5p"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # LTS estable

      - name: Install dependencies
        run: npm install

      - name: Convert H5P to SCORM
        run: npm run build

      - name: Upload SCORM package (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: output
          path: output.zip
          if-no-files-found: error
          # Nota: desde v4, por defecto NO sube ficheros ocultos. Actívalo si algún día lo necesitas:
          # include-hidden-files: true
